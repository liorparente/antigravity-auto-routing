[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-auto-routing"
version = "3.6.0"
description = "Deterministic quality-first multi-agent orchestration and calibrated worker routing protocol."
requires-python = ">=3.10"
authors = [{ name = "Lior Parente" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
eval = [
    "aiosqlite>=0.20.0",
    "litellm>=1.35.0",
    "pyyaml>=6.0.1",
]

[project.urls]
"Homepage" = "https://github.com/liorparente/antigravity-auto-routing"
"Repository" = "https://github.com/liorparente/antigravity-auto-routing.git"
"Issues" = "https://github.com/liorparente/antigravity-auto-routing/issues"

[tool.setuptools]
packages = ["worker_routing"]

[tool.setuptools.package-dir]
worker_routing = "skills/worker-routing"

[tool.pytest.ini_options]
testpaths = ["skills/worker-routing", "skills/council-review/tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["N999"]
