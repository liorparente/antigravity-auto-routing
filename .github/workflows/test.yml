name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # The one list of Python modules ruff and mypy both check. Single-sourced
    # because it was duplicated across the two steps, so every new module had
    # to be added twice — and a module added to only one of them is checked by
    # only one of them, silently.
    env:
      PYTHON_MODULES: >-
        skills/worker-routing/routing_check.py
        skills/worker-routing/test_routing.py
        skills/worker-routing/agent_council.py
        skills/worker-routing/advisory_consultation.py
        skills/worker-routing/learning_journal.py
        skills/worker-routing/production_invoker.py
        skills/worker-routing/test_production_invoker.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lint tooling
        run: pip install ruff mypy

      - name: Run routing-check unit and integration tests
        run: python3 skills/worker-routing/test_routing.py -v

      - name: Lint with ruff
        run: ruff check $PYTHON_MODULES

      - name: Type-check with mypy
        run: mypy $PYTHON_MODULES

      - name: Shellcheck installer and audit scripts
        run: shellcheck install.sh uninstall.sh skills/worker-routing/routing-audit.sh
